version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Variáveis públicas do Supabase/Lovable Cloud (embarcadas no build)
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: graficarelli-web
    restart: unless-stopped
    ports:
      # Mapeia porta 80 do container → porta 8080 do host
      # Use um proxy reverso (Traefik/Nginx Proxy Manager/Caddy) na VPS para HTTPS
      - "8080:80"
    networks:
      - web-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  web-network:
    driver: bridge
